    <script>
      window.addEventListener(
        'error',
        function (event) {
          if (
            event &&
            typeof event.filename === 'string' &&
            (event.filename.startsWith('chrome-extension://') ||
              event.filename.startsWith('moz-extension://'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        },
        true
      );
    </script>
